<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="40%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <linearGradient id="goldClover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#b08820"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="10" fill="#0d0c14"/>

  <!-- Shopping bag outline (gold) -->
  <!-- Handle left -->
  <path d="M22 22 Q22 14 28 14 Q34 14 34 22" fill="none" stroke="url(#gold)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Bag body -->
  <path d="M17 22 L14 52 Q14 54 16 54 L48 54 Q50 54 50 52 L47 22 Z" fill="none" stroke="url(#gold)" stroke-width="2.4"/>

  <!-- 4-leaf clover inside bag -->
  <!-- Leaf top -->
  <circle cx="32" cy="30" r="5.5" fill="url(#goldClover)" opacity=".92"/>
  <!-- Leaf bottom -->
  <circle cx="32" cy="41" r="5.5" fill="url(#goldClover)" opacity=".92"/>
  <!-- Leaf left -->
  <circle cx="26.5" cy="35.5" r="5.5" fill="url(#goldClover)" opacity=".92"/>
  <!-- Leaf right -->
  <circle cx="37.5" cy="35.5" r="5.5" fill="url(#goldClover)" opacity=".92"/>
  <!-- Stem -->
  <path d="M32 46 Q31 50 30 52" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center highlight -->
  <circle cx="32" cy="35.5" r="2.2" fill="#f5e070" opacity=".6"/>
</svg>
