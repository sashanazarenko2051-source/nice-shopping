<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Nice Shopping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="/api/products" as="fetch" crossorigin>
  <style>
    /* ── Sidebar header ── */
    .filter-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
    .filter-hdr__title{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dark)}
    .filter-reset{font-size:.72rem;color:var(--gray);border-bottom:1px solid currentColor;cursor:pointer;transition:color .15s;padding-bottom:1px}
    .filter-reset:hover{color:#f87171}
    /* ── Filter tags vertical on desktop ── */
    .filter-tags{display:flex;flex-direction:column;gap:3px}
    .filter-tag{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;
      font-size:.8rem;cursor:pointer;transition:all .18s;
      background:transparent;color:var(--gray);text-align:left;width:100%;
      position:relative;overflow:hidden;
    }
    .filter-tag::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      border-radius:0 2px 2px 0;opacity:0;transition:opacity .18s;
    }
    .filter-tag:hover{border-color:var(--border-h);color:var(--dark);background:rgba(255,255,255,.04)}
    .filter-tag:hover::before{opacity:.6}
    .filter-tag.active{font-weight:600}
    .filter-tag .ftag-cnt{font-size:.68rem;opacity:.45;margin-left:4px;font-weight:400}

    /* ── Category colours ── */
    [data-cat="all"].active{border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.14);color:#c4b5fd}
    [data-cat="all"].active::before{background:#8b5cf6;opacity:1}
    [data-cat="bras"]{--cc:210,70%,60%}
    [data-cat="bras"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="bras"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="lingerie"][data-gender="women"]{--cc:330,80%,65%}
    [data-cat="lingerie"][data-gender="women"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="lingerie"][data-gender="women"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="winter"][data-gender="women"]{--cc:190,75%,55%}
    [data-cat="winter"][data-gender="women"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="winter"][data-gender="women"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="summer"][data-gender="women"]{--cc:145,65%,55%}
    [data-cat="summer"][data-gender="women"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="summer"][data-gender="women"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="stockings"]{--cc:280,70%,65%}
    [data-cat="stockings"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="stockings"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="tshirts"][data-gender="women"]{--cc:25,90%,60%}
    [data-cat="tshirts"][data-gender="women"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="tshirts"][data-gender="women"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="peignoirs"]{--cc:350,75%,62%}
    [data-cat="peignoirs"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="peignoirs"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="jewelry"]{--cc:45,90%,58%}
    [data-cat="jewelry"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="jewelry"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="lingerie"][data-gender="men"]{--cc:215,65%,60%}
    [data-cat="lingerie"][data-gender="men"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="lingerie"][data-gender="men"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="tshirts"][data-gender="men"]{--cc:168,60%,52%}
    [data-cat="tshirts"][data-gender="men"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="tshirts"][data-gender="men"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="winter"][data-gender="men"]{--cc:200,70%,55%}
    [data-cat="winter"][data-gender="men"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="winter"][data-gender="men"].active::before{background:hsl(var(--cc));opacity:1}
    [data-cat="summer"][data-gender="men"]{--cc:120,55%,52%}
    [data-cat="summer"][data-gender="men"].active{border-color:hsla(var(--cc),.6);background:hsla(var(--cc),.1);color:hsl(var(--cc))}
    [data-cat="summer"][data-gender="men"].active::before{background:hsl(var(--cc));opacity:1}
    /* ── Price range ── */
    .price-range{display:flex;align-items:center;gap:8px}
    .price-inp{width:72px;padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem;background:rgba(139,92,246,.04);color:var(--dark);outline:none;font-family:inherit;transition:border-color .18s}
    .price-inp:focus{border-color:var(--border-h)}
    .price-sep{color:var(--gray);font-size:.85rem}
    /* ── Active chips ── */
    .active-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:0}
    .active-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 12px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.3);border-radius:100px;font-size:.75rem;color:rgba(196,181,253,.9);animation:chip-in .15s ease}
    .active-chip-x{color:rgba(196,181,253,.45);font-size:1rem;line-height:1;cursor:pointer;transition:color .15s}
    .active-chip-x:hover{color:#f87171}
    @keyframes chip-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
    /* ── View toggle ── */
    .view-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
    .view-btn{padding:6px 11px;font-size:1rem;color:var(--gray);transition:all .15s;line-height:1}
    .view-btn.active{background:rgba(139,92,246,.18);color:rgba(196,181,253,.95)}
    /* ── List view ── */
    .products__grid.view-list{grid-template-columns:1fr;gap:12px}
    .view-list .product-card{display:grid;grid-template-columns:160px 1fr;min-height:160px}
    .view-list .product-card__img-wrap{aspect-ratio:unset;height:100%}
    .view-list .product-card__body{display:flex;flex-direction:column;justify-content:center;padding:16px 20px;gap:4px}
    .view-list .product-card__name{font-size:1rem;margin-bottom:4px}
    .view-list .product-card__prices{margin-bottom:2px}
    .view-list .oos-notify{width:auto;display:inline-block;border-top:none;padding:4px 12px;border:1px solid rgba(139,92,246,.25);border-radius:8px;margin-top:4px}
    /* ── Product name capitalize ── */
    .product-card__name a{text-transform:capitalize}
    /* ── Empty state ── */
    .catalog-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;text-align:center;color:var(--gray);grid-column:1/-1}
    .catalog-empty__icon{font-size:3.5rem;margin-bottom:16px;opacity:.5}
    .catalog-empty__title{font-size:1.1rem;font-weight:600;color:var(--dark);margin-bottom:8px}
    .catalog-empty__sub{font-size:.9rem;line-height:1.6}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* ── Mobile ── */
    @media(max-width:1024px){
      .filter-tags{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
      .filter-tags::-webkit-scrollbar{display:none}
      .filter-tag{flex-shrink:0;white-space:nowrap;width:auto}
      .filter-hdr{margin-bottom:12px;padding-bottom:10px}
      .view-list .product-card{grid-template-columns:120px 1fr;min-height:120px}
    }
  </style>
</head>

<script>
var activeCat = 'all';
var activeGender = '';
var activePrice = 'all';
var activeSize = '';
var activeSort = 'default';
var activeSearch = '';
var activePriceMin = '';
var activePriceMax = '';
var activeView = 'grid';

var catNames = {
  'lingerie:women':  window.i18n('filter.wl'),
  'lingerie:men':    window.i18n('filter.ml'),
  'bras:':           window.i18n('filter.br'),
  'bras:women':      window.i18n('filter.br'),
  'winter:women':    '❄️ ' + window.i18n('filter.wws'),
  'winter:men':      '❄️ ' + window.i18n('filter.wms'),
  'summer:women':    '☀️ ' + window.i18n('filter.sws'),
  'summer:men':      '☀️ ' + window.i18n('filter.sms'),
  'socks:women':     window.i18n('filter.ws'),
  'socks:men':       window.i18n('filter.ms'),
  'stockings:women': window.i18n('filter.stockings'),
  'tshirts:women':   window.i18n('filter.wts'),
  'tshirts:men':     window.i18n('filter.mts'),
  'peignoirs:women': window.i18n('filter.peignoirs'),
  'jewelry:':        window.i18n('filter.jewelry'),
  'jewelry:women':   window.i18n('filter.jewelry'),
};

var urlParams = new URLSearchParams(location.search);
var urlCat = urlParams.get('cat') || '';
var urlGender = urlParams.get('gender') || '';
if (urlCat) {
  activeCat = urlCat; activeGender = urlGender;
  var key = urlCat + ':' + urlGender;
  var label = catNames[key] || urlCat;
  var titleEl = document.getElementById('pageTitle');
  var crumbEl = document.getElementById('crumbCat');
  titleEl.removeAttribute('data-i18n');
  crumbEl.removeAttribute('data-i18n');
  titleEl.textContent = label;
  crumbEl.textContent = label;
  var matchBtn = document.querySelector('[data-cat="' + urlCat + '"][data-gender="' + urlGender + '"]');
  if (matchBtn) { matchBtn.classList.add('active'); document.querySelector('[data-cat="all"]').classList.remove('active'); }
}

// Sizes per category
var SIZE_MAP = {
  'socks:women':     ['35-38', '38-40', '40-42'],
  'socks:men':       ['39-41', '41-43', '43-45', '45-47'],
  'lingerie:women':  ['XS', 'S', 'M', 'L', 'XL', 'XXL'],
  'lingerie:men':    ['S', 'M', 'L', 'XL', 'XXL'],
  'bras:':           ['70A', '70B', '70C', '75A', '75B', '75C', '80B', '80C', '85C', '80D', '85D'],
  'winter:':         ['XS', 'S', 'M', 'L', 'XL', 'XXL'],
  'summer:':         ['XS', 'S', 'M', 'L', 'XL', 'XXL'],
  'stockings:women': ['S/M', 'L/XL', '36-39', '40-44'],
  'tshirts:':        ['XS', 'S', 'M', 'L', 'XL', 'XXL'],
  'peignoirs:women': ['S/M', 'L/XL', 'XL/XXL'],
  'all:':            ['XS', 'S', 'M', 'L', 'XL', '35-38', '38-40', '39-41', '43-45', '45-47', '70B', '75C', '80C']
};
var sizeEl = document.getElementById('sizeFilters');

function renderSizes(cat, gender) {
  var key = (cat === 'all') ? 'all:' : (cat + ':' + (gender || ''));
  var sizes = SIZE_MAP[key] || SIZE_MAP[cat + ':'] || [];
  activeSize = '';
  sizeEl.innerHTML = sizes.map(function(s) {
    return '<button class="filter-tag" data-size="' + s + '">' + s + '</button>';
  }).join('');
}
renderSizes(activeCat, activeGender);

function fmtCount(n) {
  if (window.LANG === 'en') return n + (n === 1 ? ' item' : ' items');
  return n + (n===1?' товар':n<5?' товари':' товарів');
}

function renderActiveChips() {
  var chips = [];
  var catBtn = document.querySelector('[data-cat].active');
  if (catBtn && catBtn.dataset.cat !== 'all') chips.push({ label: catBtn.textContent.replace(/\d+$/,'').trim(), clear: function(){ document.querySelector('[data-cat="all"]').click(); } });
  if (activeSize) chips.push({ label: 'Розмір: ' + activeSize, clear: function(){ activeSize=''; document.querySelectorAll('[data-size]').forEach(function(b){b.classList.remove('active');}); render(); } });
  if (activeSearch) chips.push({ label: '🔍 ' + activeSearch, clear: function(){ activeSearch=''; document.getElementById('searchInput').value=''; render(); } });
  if (activePriceMin || activePriceMax) {
    var lbl = 'Ціна: ' + (activePriceMin || '0') + '–' + (activePriceMax || '∞') + '₴';
    chips.push({ label: lbl, clear: function(){ activePriceMin=''; activePriceMax=''; document.getElementById('priceMin').value=''; document.getElementById('priceMax').value=''; render(); } });
  }
  var el = document.getElementById('activeChips');
  el.innerHTML = chips.map(function(c, i) {
    return '<span class="active-chip">' + c.label + '<button class="active-chip-x" data-chi="' + i + '" title="Прибрати">×</button></span>';
  }).join('');
  el.querySelectorAll('.active-chip-x').forEach(function(btn) {
    btn.addEventListener('click', function() { chips[+btn.dataset.chi].clear(); });
  });
}

function render() {
  var q = activeSearch.trim().toLowerCase();
  var mn = activePriceMin ? +activePriceMin : null;
  var mx = activePriceMax ? +activePriceMax : null;
  var products = PRODUCTS.filter(function(p) {
    if (activeCat !== 'all' && p.category !== activeCat) return false;
    if (activeGender && p.gender !== activeGender) return false;
    if (activeSize && (p.sizes || []).indexOf(activeSize) === -1) return false;
    if (mn !== null && p.price < mn) return false;
    if (mx !== null && p.price > mx) return false;
    if (q && (p.name || '').toLowerCase().indexOf(q) === -1 && (p.description || '').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  if (activeSort === 'price-asc') products.sort(function(a,b){return a.price-b.price;});
  else if (activeSort === 'price-desc') products.sort(function(a,b){return b.price-a.price;});
  else if (activeSort === 'rating') products.sort(function(a,b){return b.rating-a.rating;});
  else if (activeSort === 'discount') products = products.filter(function(p){return p.oldPrice;}).concat(products.filter(function(p){return !p.oldPrice;}));
  /* Always push out-of-stock to bottom */
  var inStk = products.filter(function(p){ return p.stock == null || p.stock > 0; });
  var outStk = products.filter(function(p){ return p.stock != null && p.stock === 0; });
  products = inStk.concat(outStk);
  document.getElementById('count').textContent = fmtCount(products.length);
  renderActiveChips();
  if (products.length === 0) {
    document.getElementById('grid').innerHTML =
      '<div class="catalog-empty"><div class="catalog-empty__icon">🛍️</div>' +
        '<div class="catalog-empty__title">' + window.i18n('catalog.empty.t') + '</div>' +
        '<div class="catalog-empty__sub">' + window.i18n('catalog.empty.p') + '</div></div>';
    return;
  }
  document.getElementById('grid').innerHTML = products.map(renderProductCard).join('');
}

function setView(v) {
  activeView = v;
  var grid = document.getElementById('grid');
  document.getElementById('viewGrid').classList.toggle('active', v === 'grid');
  document.getElementById('viewList').classList.toggle('active', v === 'list');
  grid.classList.toggle('view-list', v === 'list');
  localStorage.setItem('ns_catalog_view', v);
}

function resetFilters() {
  activeCat = 'all'; activeGender = ''; activeSize = ''; activeSearch = '';
  activePriceMin = ''; activePriceMax = ''; activeSort = 'default';
  document.getElementById('searchInput').value = '';
  document.getElementById('priceMin').value = '';
  document.getElementById('priceMax').value = '';
  document.getElementById('sortSelect').value = 'default';
  document.querySelectorAll('[data-cat]').forEach(function(b){b.classList.remove('active');});
  document.querySelector('[data-cat="all"]').classList.add('active');
  document.querySelectorAll('[data-size]').forEach(function(b){b.classList.remove('active');});
  render();
}

function bindCatBtn(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-cat]').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    activeGender = btn.dataset.gender || '';
    renderSizes(activeCat, activeGender);
    render();
  });
}
document.querySelectorAll('[data-cat]').forEach(bindCatBtn);

document.querySelectorAll('[data-price]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-price]').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active'); activePrice = btn.dataset.price; render();
  });
});
sizeEl.addEventListener('click', function(e) {
  var btn = e.target.closest('[data-size]'); if (!btn) return;
  if (btn.classList.contains('active')) { btn.classList.remove('active'); activeSize = ''; }
  else { document.querySelectorAll('[data-size]').forEach(function(b){b.classList.remove('active');}); btn.classList.add('active'); activeSize = btn.dataset.size; }
  render();
});
document.getElementById('sortSelect').addEventListener('change', function() { activeSort = this.value; render(); });
document.getElementById('searchInput').addEventListener('input', function() { activeSearch = this.value; render(); });
document.getElementById('priceMin').addEventListener('input', function() { activePriceMin = this.value; render(); });
document.getElementById('priceMax').addEventListener('input', function() { activePriceMax = this.value; render(); });
document.getElementById('resetFilters').addEventListener('click', resetFilters);
/* restore view preference */
(function(){ var v = localStorage.getItem('ns_catalog_view'); if (v === 'list') setView('list'); })();

function injectDynamicCats() {
  var container = document.querySelector('.filter-tags');
  if (!container) return;
  var existing = {};
  container.querySelectorAll('[data-cat]').forEach(function(b) {
    existing[(b.dataset.cat||'') + ':' + (b.dataset.gender||'')] = true;
  });
  var customCats = [];
  try { customCats = JSON.parse(localStorage.getItem('ns_cats')) || []; } catch(e) {}
  var labelMap = {};
  customCats.forEach(function(c) { labelMap[(c.key||'') + ':' + (c.gender||'')] = { label: c.label, icon: c.icon||'📦' }; });
  var seen = {};
  PRODUCTS.forEach(function(p) {
    if (!p.category) return;
    var combo = p.category + ':' + (p.gender||'');
    if (!seen[combo]) seen[combo] = { cat: p.category, gender: p.gender||'' };
  });
  Object.keys(seen).forEach(function(combo) {
    if (existing[combo]) return;
    var info = seen[combo];
    var meta = labelMap[combo];
    var label = (meta && meta.label) || catNames[combo] || info.cat;
    var icon = (meta && meta.icon) || '📦';
    var btn = document.createElement('button');
    btn.className = 'filter-tag';
    btn.dataset.cat = info.cat;
    btn.dataset.gender = info.gender;
    btn.textContent = icon + ' ' + label;
    bindCatBtn(btn);
    container.appendChild(btn);
    if (urlCat === info.cat && urlGender === info.gender) {
      document.querySelectorAll('[data-cat]').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
    }
  });
}

onProductsReady(function() { injectDynamicCats(); render(); });

document.getElementById('menuToggle').addEventListener('click', function() {
  document.getElementById('nav').classList.toggle('open');
});
applyLang();
</script>
